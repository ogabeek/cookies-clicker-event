<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Siwatko Clicker</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="app">
            <nav>
                <h1>Siwatko<br>Clicker</h1>
                
                <button id="achievements_button" onclick="toggleAchievements()"></button>
                <button id="leaderboard_button" onclick="window.open('https://leaguesofcode.space/leaderboard/')"></button>

                <div class="rebirth_container">
                    <div id="rebirth_text" class="rebirth_text">Rebirths: 0 | Cost: 100000 Victors | Bonus: +0 per click</div>
                    <button id="rebirth_button" type="button">REBIRTH</button>
                </div>
            </nav>
            <div id="achievements_panel" class="achievements_panel"></div>

            <div class="game">
                <div class="cookie_window">
                    <canvas id="rain_canvas"></canvas>
                    
                    <a class="counter_text" id="counter_text">X Victors</a>
                    <a class="rate_text">1 victor per second</a>
                    <div class="cookie_container">
                        <button class="cookie_button" id="cookie_button"></button>
                    </div>
                    <div class="coin_controls">
                        <label class="coin_upload" for="coin_upload_input">Upload your coin</label>
                        <button class="coin_reset" id="coin_reset" hidden>reset</button>
                    </div>
                    <input type="file" id="coin_upload_input" accept="image/*" hidden>
                </div>
                
                <div class="farms_section" id="farms_section">
                    <div class="section_label">farms</div>
                </div>
                
                <div class="upgrades_window" id="upgrades_window">
                    <div class="section_label">upgrades</div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
